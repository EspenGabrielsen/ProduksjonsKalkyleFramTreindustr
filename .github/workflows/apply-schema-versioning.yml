name: Apply database schema versioning

on:
  push:
    branches:
      - azure-readiness
    paths:
      - .github/workflows/apply-schema-versioning.yml

permissions:
  contents: write

jobs:
  patch-datarepo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch DataRepo schema metadata
        run: python src/scripts/_patch_schema_version.py

      - name: Remove temporary patch files
        run: rm src/scripts/_patch_schema_version.py .github/workflows/apply-schema-versioning.yml

      - name: Compile changed module
        run: python -m py_compile src/data_repo.py

      - name: Commit schema versioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(data): track database schema version"
          git push origin HEAD:azure-readiness
