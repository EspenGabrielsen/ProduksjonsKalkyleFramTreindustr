name: PostgreSQL compatibility

on:
  push:
    branches:
      - azure-readiness
  pull_request:
    branches:
      - EspenTest
      - main

jobs:
  postgres-smoke:
    # Valider fresh deploy, Excel-bro, migrering og transaksjonsintegritet mot PostgreSQL 16.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prodcalc
          POSTGRES_PASSWORD: prodcalc
          POSTGRES_DB: prodcalc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodcalc -d prodcalc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://prodcalc:prodcalc@127.0.0.1:5432/prodcalc?sslmode=disable
      PRODUKSJONSKALKYLE_TEST: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run PostgreSQL smoke test
        run: python src/scripts/postgres_smoke_test.py

      - name: Run SQLite to PostgreSQL migration test
        run: python src/scripts/postgres_migration_test.py

      - name: Run transaction atomicity test
        run: python src/scripts/postgres_transaction_test.py
