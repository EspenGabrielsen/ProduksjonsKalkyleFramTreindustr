name: Apply PostgreSQL executemany fix

on:
  push:
    branches:
      - azure-readiness
    paths:
      - .github/workflows/apply-postgres-executemany-fix.yml

permissions:
  contents: write

jobs:
  patch-datarepo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch PostgreSQL executemany
        run: python src/scripts/_patch_postgres_executemany.py

      - name: Remove temporary patch files
        run: rm src/scripts/_patch_postgres_executemany.py .github/workflows/apply-postgres-executemany-fix.yml

      - name: Compile changed module
        run: python -m py_compile src/data_repo.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(postgres): execute bulk statements with cursor"
          git push origin HEAD:azure-readiness
