name: Apply DataRepo PostgreSQL init fix

on:
  push:
    branches:
      - azure-readiness
    paths:
      - .github/workflows/apply-datarepo-init-fix.yml

permissions:
  contents: write

jobs:
  patch-datarepo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch PostgreSQL initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/data_repo.py")
          text = path.read_text(encoding="utf-8")

          old = '''        # Sjekk om gammelt skjema finnes (products uten id-kolonne)
          try:
              test = self.execute("SELECT id FROM products LIMIT 1").fetchone()
              # id-kolonne finnes → nytt skjema
          except Exception:
              # Tom / gammel database. Opprett skjema idempotent, men slett aldri automatisk.
              pass

          schema_sql = POSTGRES_SCHEMA_SQL if self.backend == "postgresql" else SCHEMA_SQL
          self.executescript(schema_sql)
          self.conn.commit()
          '''

          new = '''        # SQLite kan bruke en prøvespørring uten at en feil forgifter neste
          # statement. PostgreSQL markerer derimot hele transaksjonen som aborted
          # etter en mislykket SELECT. På en helt tom PostgreSQL-database skal vi
          # derfor gå direkte til det idempotente CREATE TABLE-skjemaet.
          if self.backend == "sqlite":
              try:
                  self.execute("SELECT id FROM products LIMIT 1").fetchone()
              except sqlite3.OperationalError:
                  # Tom / gammel database. Opprett skjema idempotent, men slett aldri automatisk.
                  pass

          schema_sql = POSTGRES_SCHEMA_SQL if self.backend == "postgresql" else SCHEMA_SQL
          try:
              self.executescript(schema_sql)
              self.conn.commit()
          except Exception:
              # PostgreSQL krever eksplisitt rollback før forbindelsen kan brukes
              # videre etter en SQL-feil. Dette gjør også initialiseringsfeil tydelige
              # for kallende kode i stedet for å etterlate en ødelagt connection.
              self.conn.rollback()
              raise
          '''

          if old not in text:
              raise SystemExit("Forventet initialize-blokk ble ikke funnet; avbryter uten endring")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-datarepo-init-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_repo.py .github/workflows/apply-datarepo-init-fix.yml
          git commit -m "fix(postgres): initialize empty database safely"
          git push origin HEAD:azure-readiness
