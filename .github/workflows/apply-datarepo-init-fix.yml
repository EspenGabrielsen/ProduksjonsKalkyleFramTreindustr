name: Apply DataRepo PostgreSQL init fix

on:
  push:
    branches:
      - azure-readiness
    paths:
      - .github/workflows/apply-datarepo-init-fix.yml

permissions:
  contents: write

jobs:
  patch-datarepo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch PostgreSQL initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/data_repo.py")
          text = path.read_text(encoding="utf-8")
          init_pos = text.index("    def initialize(self):")
          start = text.index("        # Sjekk om gammelt skjema finnes", init_pos)
          end = text.index("        # Migrering: oppgrader transport_ruter", start)

          replacement = "".join([
              "        # SQLite kan bruke en prøvespørring uten at en feil forgifter neste\n",
              "        # statement. PostgreSQL markerer derimot hele transaksjonen som aborted\n",
              "        # etter en mislykket SELECT. På en helt tom PostgreSQL-database går vi\n",
              "        # derfor direkte til det idempotente CREATE TABLE-skjemaet.\n",
              "        if self.backend == \"sqlite\":\n",
              "            try:\n",
              "                self.execute(\"SELECT id FROM products LIMIT 1\").fetchone()\n",
              "            except sqlite3.OperationalError:\n",
              "                # Tom / gammel database. Opprett skjema idempotent, men slett aldri automatisk.\n",
              "                pass\n",
              "\n",
              "        schema_sql = POSTGRES_SCHEMA_SQL if self.backend == \"postgresql\" else SCHEMA_SQL\n",
              "        try:\n",
              "            self.executescript(schema_sql)\n",
              "            self.conn.commit()\n",
              "        except Exception:\n",
              "            # Ikke etterlat PostgreSQL-forbindelsen i aborted state etter SQL-feil.\n",
              "            self.conn.rollback()\n",
              "            raise\n",
              "\n",
          ])

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-datarepo-init-fix.yml

      - name: Compile changed module
        run: python -m py_compile src/data_repo.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_repo.py .github/workflows/apply-datarepo-init-fix.yml
          git commit -m "fix(postgres): initialize empty database safely"
          git push origin HEAD:azure-readiness
