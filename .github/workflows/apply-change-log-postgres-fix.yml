name: Apply PostgreSQL change-log fix

on:
  push:
    branches:
      - azure-readiness
    paths:
      - .github/workflows/apply-change-log-postgres-fix.yml

permissions:
  contents: write

jobs:
  patch-datarepo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Quote reserved PostgreSQL identifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/data_repo.py")
          text = path.read_text(encoding="utf-8")
          old = "INSERT INTO change_log (user, source"
          new = 'INSERT INTO change_log ("user", source'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Forventet 2 change_log INSERT-varianter, fant {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-change-log-postgres-fix.yml

      - name: Compile changed module
        run: python -m py_compile src/data_repo.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data_repo.py .github/workflows/apply-change-log-postgres-fix.yml
          git commit -m "fix(postgres): quote change log user column"
          git push origin HEAD:azure-readiness
